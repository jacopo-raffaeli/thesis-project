[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-project"
version = "0.1.0"
description = "Thesis utilities and collectors"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["thesis_project*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings, F: pyflakes, I: isort
select = ["E", "F", "W", "I"]
# E501 (line too long) is enforced by the formatter instead
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["thesis_project", "src"]
